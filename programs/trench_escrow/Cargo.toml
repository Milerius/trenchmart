[package]
name = "trench_escrow"
version = "0.1.0"
edition = "2021"
# tests/escrow.rs is compiled into the lib's unit-test harness (see src/lib.rs), so the crate
# can be cdylib-only: a mixed cdylib+lib crate silently disables fat LTO in cargo-build-sbf.
autotests = false
description = "Phase-2 TrenchMart escrow. Launch custody stays a Squads vault."
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "trench_escrow"

[features]
default = ["no-log-ix-name"]
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
anchor-debug = ["anchor-lang/anchor-debug"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["derive", "solana-v4"] }
solana-security-txt = "=1.1.3"

[dev-dependencies]
mollusk-svm = "=0.16.2"
proptest = "=1.12.0"
solana-account = "4.7.0"
