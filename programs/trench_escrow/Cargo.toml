[package]
name = "trench_escrow"
version = "0.1.0"
edition = "2021"
description = "Phase-2 TrenchMart escrow. Launch custody stays a Squads vault."
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "trench_escrow"

[features]
default = []
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
anchor-debug = ["anchor-lang/anchor-debug"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["derive", "solana-v4"] }
solana-security-txt = "=1.1.3"

[dev-dependencies]
proptest = "=1.12.0"
