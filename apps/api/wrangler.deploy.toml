# Local deploy override (NOT committed): wrangler.toml plus devnet vars (escrow program,
# resolver). FILES binds the trenchmart-files R2 bucket used for uploads.
name = "trenchmart-api"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
SOLANA_CLUSTER = "devnet"
APP_URL = "https://trenchmart.fun"
API_URL = "https://api.trenchmart.fun"
SIWS_DOMAIN = "trenchmart.fun"
LANDING_STATS = "auto"
AI_AGENT_ID = "trenchmart-ai-v1"
SANDBOX_BUDGET_MS = "15000"
# Devnet wallets (2026-10-17). Keypairs: /home/box/.config/trenchmart/devnet-wallets/
VAULT_ADDRESS = "47RLqPda5YLW7rFHkoJ2K5yACWu4qc7j2yYU2so64bz7" # Squads v4 vault PDA (index 0) of 2-of-3 multisig CaatcAQaDTEsrSoC3maTP1kgBWEY66hhgBNKa8Aeg55B
TRENCH_MINT = "8Gu4hXYypyRrxY6763AdhQnyHma82L3ww9wq3vy2cbq6"
BUCKET_WALLET_BUYBACK = "3Dr7SGVsAoLsdxyJFYLgZttFoE7xxN2yMcCCMzzKfZJS"
BUCKET_WALLET_AI_VERIFICATION = "5Z74hrcrVmnWejBqo6hwbcST8t3wAwGNF4sZpa3bBHMt"
BUCKET_WALLET_OPS = "6JWwknG8AWdwsaMkRSUBCTgDwSgAAbKy5ZQUCJhWeRvd"
BUCKET_WALLET_SAFETY = "BWspojGcPfyqqyHNvDgJY4Hvy62BhUaWVUsjBXgMksEP"
# trench_escrow v2 (upgraded 2026-10-18 via Squads vault 47RLqPda…; config DWgrsny5…).
# ESCROW_RESOLVER_SECRET is a Worker secret (devnet-wallets/escrow-resolver.json).
ESCROW_PROGRAM_ID = "Dbrq2sACPk98FGzLihajJd4r2Q4jdKNn62GSURndv2kw"
ESCROW_RESOLVER = "7q5UJ8PcPrL59GgcqqwC8D1p3v9VFxVyA5BRDaVZ5bww"
ESCROW_PROGRAM_VERSION = "2"

[triggers]
crons = ["*/5 * * * *"]

# Uploads (R2 bucket created 2026-10-17).
[[r2_buckets]]
binding = "FILES"
bucket_name = "trenchmart-files"

[[queues.producers]]
binding = "SCAN_QUEUE"
queue = "scan-static"

# M-03: edge rate limit for writes, keyed per client IP + method (see clientIp in app.ts).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Workers Logs: keeps console output (ALERT lines from opsCheck and the cron) searchable.
[observability]
enabled = true
