name = "trenchmart-api"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]


# Run the Worker next to the database (Supabase ap-south-1) instead of next to the visitor:
# every request does several Postgres round trips.
[placement]
mode = "smart"

[triggers]
crons = ["*/5 * * * *"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "trenchmart-files"

[[queues.producers]]
binding = "SCAN_QUEUE"
queue = "scan-static"

# Encrypted, pooled Postgres via Hyperdrive (TLS to Supabase). Created 2026-10-18 as trenchmart-db.
# Without the binding the Worker falls back to the DATABASE_URL secret (local/CI).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "067fbd6cc9a949e7a62155bf3fd2fe91"

# M-03: edge rate limit for writes, keyed per client IP + method (see clientIp in app.ts).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Workers Logs: keeps console output (ALERT lines from opsCheck and the cron) searchable.
[observability]
enabled = true
