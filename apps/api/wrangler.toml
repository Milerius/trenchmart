name = "trenchmart-api"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]


# Run the Worker next to the database (Supabase ap-south-1) instead of next to the visitor:
# every request does several Postgres round trips.
[placement]
mode = "smart"

[triggers]
crons = ["*/5 * * * *"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "trenchmart-files"

[[queues.producers]]
binding = "SCAN_QUEUE"
queue = "scan-static"

# Encrypted, pooled Postgres. Create the config and uncomment (see docs/DEPLOY_DATABASE.md).
# Without it the Worker falls back to the DATABASE_URL secret.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive config id>"
