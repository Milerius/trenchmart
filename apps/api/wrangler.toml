name = "trenchmart-api"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]


# Run the Worker next to the database (Supabase, AWS ap-south-1 / Mumbai) instead of next to
# the visitor: every request does several Postgres round trips, ~250 ms each from a far colo
# (studio overview took 8 s from the US west coast). An explicit region applies at once; smart
# mode never placed this Worker. Keep the same block in wrangler.deploy.toml.
[placement]
region = "aws:ap-south-1"

[triggers]
crons = ["*/5 * * * *"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "trenchmart-files"

[[queues.producers]]
binding = "SCAN_QUEUE"
queue = "scan-static"

# $MART holder rewards: one push batch (≤ 20 SOL transfers) per message (docs/ops/holder-rewards.md).
[[queues.producers]]
binding = "REWARDS_QUEUE"
queue = "rewards-send"

[[queues.consumers]]
queue = "rewards-send"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 40
dead_letter_queue = "rewards-send-dlq"

# Encrypted, pooled Postgres via Hyperdrive (TLS to Supabase). Created 2026-10-18 as trenchmart-db.
# Without the binding the Worker falls back to the DATABASE_URL secret (local/CI).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "067fbd6cc9a949e7a62155bf3fd2fe91"

# M-03: edge rate limit for writes, keyed per client IP + method (see clientIp in app.ts).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# API abuse limits (abuse-limits.ts, docs/ops/abuse-limits.md). Reads per IP (IPv6 /64), cache
# hits included; write route groups per IP and per signed-in wallet. Keep in sync with
# ABUSE_LIMITS (abuse-limits.test.ts checks). Namespace ids 12xx are owned by this block.
[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1201"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1202"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "TX_LIMITER"
namespace_id = "1203"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "VERIFY_LIMITER"
namespace_id = "1204"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1205"
simple = { limit = 60, period = 60 }

# Workers Logs: keeps console output (ALERT lines from opsCheck and the cron) searchable.
[observability]
enabled = true

# I-07: /tx/send per signed-in wallet (limits.ts LIMITS.txSend; docs/ops/rate-limits.md).
[[ratelimits]]
name = "TX_SEND_LIMITER"
namespace_id = "1101"
simple = { limit = 20, period = 60 }
