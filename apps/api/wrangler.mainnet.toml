# Mainnet API Worker (docs/ops/networks.md, docs/ops/mainnet-launch.md).
# Separate Worker, database, bucket and queues from devnet. Custom domain only:
# api.mainnet.trenchmart.fun, behind the zone WAF and rate-limit rules
# (docs/ops/edge-protection.md); workers.dev and preview URLs are off (deploy-api.sh enforces).
# Fails closed until launch: SOLANA_CLUSTER=mainnet is refused (every request, cron and queue
# message) unless MAINNET_LAUNCHED=1, and then it needs SOLANA_RPC_URL or HELIUS_RPC_URL.
# Deploy: TM_DEPLOY_DB_ENV=~/.config/trenchmart/supabase-mainnet.env \
#   API_HEALTH_URL=https://api.mainnet.trenchmart.fun/api/v1/health \
#   scripts/deploy-api.sh apps/api/wrangler.mainnet.toml
name = "trenchmart-api-mainnet"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.mainnet.trenchmart.fun", custom_domain = true }]

[placement]
region = "aws:ap-south-1"

[vars]
SOLANA_CLUSTER = "mainnet"
# Stays 0 until launch day (runbook step 7). 0 = the Worker refuses to serve.
MAINNET_LAUNCHED = "1"
APP_URL = "https://trenchmart.fun"
API_URL = "https://api.mainnet.trenchmart.fun"
SIWS_DOMAIN = "trenchmart.fun"
# Second host of the mainnet web Worker (trenchmart.fun is the default).
SIWS_EXTRA_DOMAINS = "mainnet.trenchmart.fun,www.trenchmart.fun"
LANDING_STATS = "auto"
AI_AGENT_ID = "trenchmart-ai-v1"
SANDBOX_BUDGET_MS = "15000"
# Money moves only after a human turns these on (docs/ops/payouts.md, holder-rewards.md).
PAYOUTS_AUTO = "0"
REWARDS_AUTO = "0"
# Mainnet addresses (deployed 2026-10-23, docs/ops/mainnet-launch.md). Squads v4 2-of-3 multisig;
# vault 0 = treasury + program upgrade authority, 1 = holder rewards, 2..5 = fee buckets.
ESCROW_PROGRAM_ID = "Dm2jtJDfSji2TASEGKxsY1CwxeUCXqGznefkJpSASZLp"
ESCROW_RESOLVER = "7aEPhhZipf2MEvDdjhzt4VdGWrDFEC8KT4pyWnGUsQ6q"
EXPECTED_UPGRADE_AUTHORITY = "AoK6JdJQgtW9Wrt2z47gHnNMju2RrwNRhTZon13K3kf1"
MULTISIG_ADDRESS = "FFsRpwj5aTteCsS9kWpUAyQ7a9KzSSbDZgwgq2JdqbsN"
VAULT_ADDRESS = "AoK6JdJQgtW9Wrt2z47gHnNMju2RrwNRhTZon13K3kf1"
REWARDS_VAULT_INDEX = "1"
BUCKET_WALLET_BUYBACK = "BcsSeH6ZFsGWZU7BSApFDPcDbKTsLRrTJoVop6NYGxTY"
BUCKET_WALLET_AI_VERIFICATION = "7B2DPketA1h9TiwCTbSHmmiWFBjGeQ3tusAG9ryBpTps"
BUCKET_WALLET_OPS = "HQcbzwj5HXqk2JEJL6X6rTgrVnVb77Yi6oS5EvNCYUcs"
BUCKET_WALLET_SAFETY = "9cX6L4NBvKSfL19k6mVGecn7JwH6qhxgC4nPR4U5YqHr"
# Secrets (wrangler secret put -c wrangler.mainnet.toml):
# SESSION_SECRET, INTERNAL_TOKEN, STATUS_PUSH_TOKEN, HELIUS_WEBHOOK_SECRET, AI_ATTEST_SECRET,
# PROXY_SECRET (set), HELIUS_RPC_URL or SOLANA_RPC_URL, ESCROW_RESOLVER_SECRET (launch).

# No cron until launch: enable "*/5 * * * *" in runbook step 7.
[triggers]
crons = ["*/5 * * * *"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "trenchmart-files-mainnet"

[[queues.producers]]
binding = "SCAN_QUEUE"
queue = "scan-static-mainnet"

[[queues.producers]]
binding = "REWARDS_QUEUE"
queue = "rewards-send-mainnet"

[[queues.consumers]]
queue = "rewards-send-mainnet"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 40
dead_letter_queue = "rewards-send-mainnet-dlq"

# trenchmart-db-mainnet -> Supabase project zydwvewzlgjbvqufxoxi (free tier, ap-south-1).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "0b1d60e34cc644eebfbd43371aba52e9"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[observability]
enabled = true

# I-07: /tx/send per signed-in wallet. Namespaces 12xx are mainnet, 11xx devnet (rate-limits.md).
[[ratelimits]]
name = "TX_SEND_LIMITER"
namespace_id = "1301"
simple = { limit = 20, period = 60 }

# POST /auth/nonce per client IP (limits.ts authNonce, docs/ops/rate-limits.md).
[[ratelimits]]
name = "AUTH_NONCE_LIMITER"
namespace_id = "1210"
simple = { limit = 20, period = 60 }

# Abuse fix 2: API keys (IP before lookup, per-wallet cap, per-key tiers) (limits.ts LIMITS; docs/ops/rate-limits.md).
[[ratelimits]]
name = "API_KEY_IP_LIMITER"
namespace_id = "1302"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "API_KEY_WALLET_LIMITER"
namespace_id = "1303"
simple = { limit = 600, period = 60 }

[[ratelimits]]
