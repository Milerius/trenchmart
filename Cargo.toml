[workspace]
members = ["programs/trench_escrow"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"

# solana-verify picks the Docker base image from this (Anchor 1.2.1 / Agave 4.3.x toolchain).
[workspace.metadata.cli]
solana = "4.3.0"

