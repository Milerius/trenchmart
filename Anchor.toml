[toolchain]
anchor_version = "1.2.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
trench_escrow = "Dbrq2sACPk98FGzLihajJd4r2Q4jdKNn62GSURndv2kw"

[programs.localnet]
trench_escrow = "Dbrq2sACPk98FGzLihajJd4r2Q4jdKNn62GSURndv2kw"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Rust instruction tests (Mollusk, against the freshly built target/deploy/trench_escrow.so),
# then the TypeScript client test against the local validator. CI's `anchor test` job runs both.
test = "TRENCH_ESCROW_REQUIRE_SBF=1 cargo test --locked --manifest-path programs/trench_escrow/Cargo.toml && pnpm exec tsx tests/trench_escrow.ts"

[hooks]

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false
