# Manual / backup run: public API health, the web app, and the internal ops check.
# The primary health check is the trenchmart-watchdog Worker's Cloudflare cron (every 5 min,
# apps/api/src/watchdog.ts): GitHub's every-10-min schedule fired once in its first hours,
# so the schedule was removed. This run reports to POST /internal/ops/report with source
# "github": a failure still raises HEALTH_CHECK_FAILED (critical), but staleness (warn after
# 20 min) only follows the watchdog's reports, so not running this never alerts.
# Alerts go to the owner's chat (/internal/ops/alerts), never email; a failed probe does not
# fail this run.
# Needs repo secret TM_INTERNAL_TOKEN (= API INTERNAL_TOKEN).
name: health-check
on:
  workflow_dispatch:
permissions: {}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API: https://api.trenchmart.fun/api/v1
      TOKEN: ${{ secrets.TM_INTERNAL_TOKEN }}
    steps:
      - name: probe API, web and ops check; report to the ops alerts feed
        run: |
          problems=()
          probe() { # name, curl args...
            local name="$1"; shift
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$@" 2>/dev/null)" || code="unreachable"
            echo "$name: $code"
            [[ "$code" =~ ^2 ]] || problems+=("$name: HTTP $code")
          }
          probe api "$API/health"
          probe web https://trenchmart.fun/
          if [[ -n "${TOKEN:-}" ]]; then
            # 503 here means a critical ops alert; it is already in the feed, so only note it.
            ops="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $TOKEN" "$API/internal/ops" 2>/dev/null)" || ops=unreachable
            echo "ops check: $ops"
            [[ "$ops" == 200 || "$ops" == 503 ]] || problems+=("ops check: HTTP $ops")
          fi
          if ((${#problems[@]})); then ok=false; detail="$(IFS='; '; echo "${problems[*]}")"; else ok=true; detail="api, web, ops check ok"; fi
          echo "result: ok=$ok $detail"
          [[ "$ok" == true ]] || echo "::warning::$detail"
          if [[ -z "${TOKEN:-}" ]]; then
            echo "::warning::TM_INTERNAL_TOKEN missing; cannot report to the ops alerts feed"; exit 0
          fi
          payload="$(jq -nc --argjson ok "$ok" --arg detail "$detail" '{check: "health-check", source: "github", ok: $ok, detail: $detail}')"
          curl -fsS --max-time 20 -o /dev/null -X POST "$API/internal/ops/report" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' --data "$payload" &&
            echo "reported" || echo "::warning::report to the ops alerts feed failed"
