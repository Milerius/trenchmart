name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# PR branches: a new push cancels the older run. main: every commit gets its own group (the
# sha), so a run is never cancelled or replaced by the next merge; each merge gets a verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Coverage gates live in packages/shared (fee/tier 100, escrow state 90, payouts 85).
      # The API integration file needs Postgres and runs in the integration job.
      # A Workers vitest pool is not used: the API imports postgres.js.
      - run: pnpm --filter @trenchmart/shared --filter @trenchmart/scanner --filter @trenchmart/chain --filter @trenchmart/ai-verifier --filter @trenchmart/db --filter @trenchmart/web --filter @trenchmart/sdk test
      - run: pnpm --filter @trenchmart/api exec vitest run src/price.test.ts src/sandbox.test.ts src/dispatch.test.ts src/edge-cache.test.ts src/openapi.test.ts src/media.test.ts src/watchdog.test.ts
      - run: pnpm --filter @trenchmart/sdk build

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trenchmart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trenchmart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trenchmart
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trenchmart/api exec vitest run src/product.test.ts src/social.test.ts src/x-oauth.test.ts src/studio.test.ts src/cache-privacy.test.ts src/agent.test.ts src/sdk.test.ts src/openapi.test.ts src/tier-balance.test.ts src/ops.test.ts src/status.test.ts src/status-public.test.ts src/sessions.test.ts

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: 9e9aab84f03d9799c7a3dc4ee77fa93b
      # Traces of failed first attempts (flaky tests included), for diagnosis.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # "Verify with X" in a real browser: web /api/v1 proxy -> real API (Postgres) -> mock X API.
  e2e-x-oauth:
    name: e2e x-oauth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trenchmart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trenchmart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trenchmart
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test -c playwright.xoauth.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x-oauth-flow
          path: test-results/
          retention-days: 7

  # Release vs production schema: after a merge to main, fail if main has migrations that
  # production has not applied (the 2026-10-18 /studio outage). Deploy with
  # scripts/deploy-api.sh, which migrates first. Read-only; skips without TM_DATABASE_URL.
  migrations-live:
    name: migrations applied live
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm db:pending (production)
        env:
          DATABASE_URL: ${{ secrets.TM_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "TM_DATABASE_URL secret missing; skip." >&2
            exit 0
          fi
          pnpm db:pending

  bundle-budget:
    name: bundle-budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Performance guard: gzip JS per prerendered page must stay under budget.
      - run: pnpm --filter @trenchmart/web build
        env:
          # Bundle sizes do not depend on the API origin; build against the local default.
          ALLOW_LOCAL_API: '1'
      - run: pnpm --filter @trenchmart/web budget

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'

  anchor-build:
    name: anchor build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: anchor build
        run: |
          set -euo pipefail
          if [ ! -f programs/trench_escrow/Cargo.toml ]; then
            echo "programs/trench_escrow is not present; skipping anchor build."
            exit 0
          fi
          bash .github/scripts/anchor-toolchain.sh
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$HOME/.local/bin:$PATH"
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase --force -o target/deploy/trench_escrow-keypair.json
          anchor keys sync
          anchor build
      # The agent-e2e job deploys this build on a local validator (address = this throwaway keypair).
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: escrow-program
          path: |
            target/deploy/trench_escrow.so
            target/deploy/trench_escrow-keypair.json
          if-no-files-found: error
          retention-days: 3

  agent-e2e:
    name: agent e2e (local validator)
    needs: anchor-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trenchmart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trenchmart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trenchmart
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          name: escrow-program
          path: .data/escrow
      - name: solana cli
        run: |
          set -euo pipefail
          curl -fsSL https://release.anza.xyz/v4.3.2/install | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: seller agent + buyer agent against a local validator
        run: |
          set -euo pipefail
          export ESCROW_SO="$PWD/.data/escrow/trench_escrow.so"
          ESCROW_PROGRAM_ID="$(solana-keygen pubkey .data/escrow/trench_escrow-keypair.json)"
          export ESCROW_PROGRAM_ID
          bash examples/ci/run.sh
      - name: logs
        if: failure()
        run: |
          tail -n 200 .data/agent-e2e/api.log || true
          tail -n 50 .data/agent-e2e/validator.log || true

  anchor-test:
    name: anchor test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - id: gate
        run: |
          if [ -f programs/trench_escrow/Cargo.toml ]; then
            echo present=true >> "$GITHUB_OUTPUT"
          else
            echo present=false >> "$GITHUB_OUTPUT"
            echo "programs/trench_escrow is not present; skipping anchor test."
          fi
      - if: steps.gate.outputs.present == 'true'
        uses: pnpm/action-setup@v6.1.0
      - if: steps.gate.outputs.present == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - if: steps.gate.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.present == 'true'
        name: anchor test
        run: |
          set -euo pipefail
          bash .github/scripts/anchor-toolchain.sh
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$HOME/.local/bin:$PATH"
          mkdir -p "$HOME/.config/solana" target/deploy
          solana-keygen new --no-bip39-passphrase --force -o "$HOME/.config/solana/id.json"
          solana-keygen new --no-bip39-passphrase --force -o target/deploy/trench_escrow-keypair.json
          anchor keys sync
          anchor test --validator legacy

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: cargo clippy
        run: |
          set -euo pipefail
          if [ ! -f programs/trench_escrow/Cargo.toml ]; then
            echo "programs/trench_escrow is not present; skipping clippy."
            exit 0
          fi
          bash .github/scripts/anchor-toolchain.sh
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo clippy --manifest-path programs/trench_escrow/Cargo.toml --all-targets -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: cargo fmt
        run: |
          set -euo pipefail
          if [ ! -f programs/trench_escrow/Cargo.toml ]; then
            echo "programs/trench_escrow is not present; skipping cargo fmt."
            exit 0
          fi
          bash .github/scripts/anchor-toolchain.sh
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo fmt --manifest-path programs/trench_escrow/Cargo.toml -- --check

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: cargo audit
        run: |
          set -euo pipefail
          if [ ! -f programs/trench_escrow/Cargo.toml ]; then
            echo "programs/trench_escrow is not present; skipping cargo audit."
            exit 0
          fi
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.1 --profile minimal
          source "$HOME/.cargo/env"
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - typecheck
      - lint
      - unit
      - integration
      - e2e
      - bundle-budget
      - audit
      - gitleaks
      - anchor-build
      - agent-e2e
      - anchor-test
      - clippy
      - fmt
      - cargo-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require every job
        env:
          TYPECHECK: ${{ needs.typecheck.result }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          E2E: ${{ needs.e2e.result }}
          BUNDLE_BUDGET: ${{ needs.bundle-budget.result }}
          AUDIT: ${{ needs.audit.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          ANCHOR_BUILD: ${{ needs.anchor-build.result }}
          AGENT_E2E: ${{ needs.agent-e2e.result }}
          ANCHOR_TEST: ${{ needs.anchor-test.result }}
          CLIPPY: ${{ needs.clippy.result }}
          FMT: ${{ needs.fmt.result }}
          CARGO_AUDIT: ${{ needs.cargo-audit.result }}
        run: |
          python3 - <<'PY'
          import os, sys
          results = {
              "typecheck": os.environ["TYPECHECK"],
              "lint": os.environ["LINT"],
              "unit": os.environ["UNIT"],
              "integration": os.environ["INTEGRATION"],
              "e2e": os.environ["E2E"],
              "bundle-budget": os.environ["BUNDLE_BUDGET"],
              "audit": os.environ["AUDIT"],
              "gitleaks": os.environ["GITLEAKS"],
              "anchor-build": os.environ["ANCHOR_BUILD"],
              "agent-e2e": os.environ["AGENT_E2E"],
              "anchor-test": os.environ["ANCHOR_TEST"],
              "clippy": os.environ["CLIPPY"],
              "fmt": os.environ["FMT"],
              "cargo-audit": os.environ["CARGO_AUDIT"],
          }
          print(results)
          bad = {name: result for name, result in results.items() if result not in ("success", "skipped")}
          if bad:
              print("not green:", bad)
              sys.exit(1)
          PY
